[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-embedding"
version = "0.1.0"
description = "Natively multimodal search and study project with Gemini Embedding 2 and ChromaDB"
readme = "README.md"
authors = [
    { name = "Juan Jose", email = "41393022+jotacib3@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.0",
    "google-genai>=1.0.0",
    "matplotlib>=3.8.0",
    "pillow>=10.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
gemini-search = "gemini_embedding.cli:app"

[dependency-groups]
dev = [
    "ipywidgets>=8.1.0",
    "jupyter>=1.1.0",
    "pytest>=9.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
